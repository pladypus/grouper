<html lang="en">

<title>PROTOTYPE · grouper main screen</title>
<!--
  PROTOTYPE, THROWAWAY. Lives on branch prototype/main-screen, never merged.
  Question (wayfinder ticket "What does the main screen look like?").
  Round 2: the owner picked variant C (board first, drawers). Changes in this round:
  bigger cards that fill the screen, Rules are pairs only (Good pair / Keep apart),
  the "Number of students in group" label, and dark mode (system + manual toggle).
  Round 1 (variants A/B/C) is in this branch's history. Fake data, in-memory only, toy solver.

<style>
  :root { color-scheme: light;
    --bg:#f6f5f2; --panel:#ffffff; --ink:#1e1f24; --mute:#6b6f7a; --line:#dcdbd6; --field:#ffffff;
    --bar:#1e1f24; --bar-ink:#ffffff; --bar-mute:#c9cbd3; --bar-btn:#2d2f37; --bar-line:#444;
    --accent:#3a5bd9; --accent-ink:#ffffff; --accent-soft:#e6ebfd;
    --warn:#a15c00; --warn-soft:#fff3df; --warn-line:#f0cf9a;
    --bad:#b42318; --bad-soft:#fde8e6; --bad-line:#f3b7b0;
    --ok:#1d7a46; --ok-soft:#e3f3e9; --lock:#5b3fb5; --lock-soft:#efeafd; --flash:#ffe58f; --off:#eeeeee; --hue-s:58%; --hue-l:40%; --hue-soft-l:94%; --on-c:#ffffff; --lock-band:#3d4250; --lock-tint:#eef0f3; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark;
    --bg:#15161a; --panel:#1f2127; --ink:#e8e9ee; --mute:#9a9fac; --line:#343741; --field:#272a31;
    --bar:#0c0d10; --bar-ink:#e8e9ee; --bar-mute:#9a9fac; --bar-btn:#23252c; --bar-line:#3a3d46;
    --accent:#7d97ff; --accent-ink:#0c0d10; --accent-soft:#25305a;
    --warn:#ffb950; --warn-soft:#3a2a12; --warn-line:#6b4b1c;
    --bad:#ff8a80; --bad-soft:#3d1c1a; --bad-line:#6e2f2a;
    --ok:#5fd394; --ok-soft:#173726; --lock:#b39dff; --lock-soft:#2a2342; --flash:#5a4a10; --off:#2a2c33; --hue-s:38%; --hue-l:36%; --hue-soft-l:21%; --on-c:#f2f3f7; --lock-band:#4a4f5c; --lock-tint:#262930; } }
  :root[data-theme="dark"] { color-scheme: dark;
    --bg:#15161a; --panel:#1f2127; --ink:#e8e9ee; --mute:#9a9fac; --line:#343741; --field:#272a31;
    --bar:#0c0d10; --bar-ink:#e8e9ee; --bar-mute:#9a9fac; --bar-btn:#23252c; --bar-line:#3a3d46;
    --accent:#7d97ff; --accent-ink:#0c0d10; --accent-soft:#25305a;
    --warn:#ffb950; --warn-soft:#3a2a12; --warn-line:#6b4b1c;
    --bad:#ff8a80; --bad-soft:#3d1c1a; --bad-line:#6e2f2a;
    --ok:#5fd394; --ok-soft:#173726; --lock:#b39dff; --lock-soft:#2a2342; --flash:#5a4a10; --off:#2a2c33; --hue-s:38%; --hue-l:36%; --hue-soft-l:21%; --on-c:#f2f3f7; --lock-band:#4a4f5c; --lock-tint:#262930; }

  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body { font:15px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  button, select, input { font:inherit; color:inherit; }
  button { cursor:pointer; border:1px solid var(--line); background:var(--panel); border-radius:6px; padding:4px 10px; }
  button:hover { border-color:var(--mute); }
  button.link { border:0; background:none; color:var(--accent); padding:0 4px; text-decoration:underline; }
  select, input { border:1px solid var(--line); border-radius:6px; padding:5px 8px; background:var(--field); }
  h3 { margin:0; }
  small { color:var(--mute); }
  .err { color:var(--bad); margin:6px 0; }

  /* top bar */
  .bar { position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; padding:10px 16px; background:var(--bar); color:var(--bar-ink); }
  .brand { font-weight:800; font-size:20px; }
  .bar select, .bar button:not(.shuffle), .bar input { background:var(--bar-btn); color:var(--bar-ink); border-color:var(--bar-line); }
  .bar small, .bar label { color:var(--bar-mute); }
  .bar .warn { color:#ffc56b; }
  .bar .err { color:#ff9c94; }
  .spacer { flex:1; }

  .sizes .msgs { flex-basis:100%; }
  .stepper { display:inline-flex; align-items:center; }
  .stepper button { width:32px; padding:4px 0; }

  .split input { width:130px; }
  .shuffle { background:var(--accent); color:var(--accent-ink); border:0; font-weight:700; font-size:20px; padding:10px 26px; border-radius:8px; }
  .shuffle small { color:inherit; opacity:.8; font-weight:400; font-size:14px; }
  .theme { font-size:13px; }

  /* board */
  #app { height:100vh; height:100dvh; display:flex; flex-direction:column; }
  .bar { flex:none; }
  .board { flex:1; min-height:0; overflow:auto; padding:12px 16px 16px; display:flex; flex-direction:column; }
  .notice { border-radius:8px; padding:10px 14px; margin:0 0 10px; display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; }
  .notice.stale { background:var(--warn-soft); border:1px solid var(--warn-line); }
  .notice.conflict { background:var(--bad-soft); border:1px solid var(--bad-line); display:block; }
  .notice.conflict details { margin-top:6px; }
  .notice.conflict a { color:var(--accent); }
  .notice.hint { background:var(--accent-soft); }
  .tiles { flex:1; min-height:0; display:flex; flex-wrap:wrap; justify-content:center; align-content:stretch; gap:14px; }
  .tiles > .group { min-height:0; container-type:size; width:calc((100% - (var(--cols) - 1) * 14px) / var(--cols)); height:calc((100% - (var(--rows) - 1) * 14px) / var(--rows)); }
  @media (max-width: 760px) { .tiles > .group { width:100%; height:auto; container-type:inline-size; } .chip { font-size:20px !important; min-height:44px !important; } }
  /* GROUP CARD v2 */
  .group { --c: hsl(var(--hue) var(--hue-s) var(--hue-l)); --c-soft: hsl(var(--hue) var(--hue-s) var(--hue-soft-l));
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    display:flex; flex-direction:column; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .group header { display:flex; align-items:center; gap:10px; padding:10px 12px 10px 16px; background:var(--c); color:var(--on-c); }
  .group header h3 { font-size:clamp(17px,1.5vw,24px); font-weight:800; letter-spacing:.01em; }
  .gcount { margin-right:auto; opacity:.85; font-size:14px; font-weight:600; }
  .lockbtn { display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:5px 12px; font-size:14px; font-weight:600;
    background:transparent; color:inherit; border:1.5px solid currentColor; opacity:.9; }
  .lockbtn:hover { opacity:1; border-color:currentColor; background:rgba(255,255,255,.15); }
  .lockbtn svg { width:16px; height:16px; }
  .lockbtn[aria-pressed=true] { background:var(--on-c); color:var(--lock); border-color:var(--on-c); opacity:1; }
  .group .members { flex:1; min-height:0; list-style:none; margin:0; padding:10px 12px; display:flex; flex-direction:column; justify-content:center; gap:min(1.2cqh, 10px); }
  .group .members.two { display:grid; grid-template-columns:1fr 1fr; align-content:center; }
  .chip { width:100%; min-height:0; line-height:1.2; display:flex; align-items:center; gap:12px; text-align:left; border-radius:10px; padding:.22em .45em;
    font-size:clamp(16px, min(8.5cqw, 9cqh), 46px); font-weight:500; background:transparent; border:2px solid transparent; user-select:none; touch-action:manipulation; cursor:grab; }
  .chip::before { content:""; width:10px; height:10px; border-radius:50%; background:var(--c); flex:none; }
  .chip:hover { background:var(--c-soft); border-color:transparent; }
  .chip.sel { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .chip.sel::before { background:var(--accent-ink); }
  .chip.gone { text-decoration:line-through; color:var(--mute); }
  .chip.over { border-style:dashed; border-color:var(--accent); background:var(--accent-soft); }
  .group.locked { border-color:var(--lock-band); box-shadow:0 0 0 2px var(--lock-band); }
  .group.locked header { background:var(--lock-band); }
  .group.locked .lockbtn[aria-pressed=true] { color:var(--lock-band); }
  .group.locked .members { background:var(--lock-tint); }
  .group.locked .chip { cursor:not-allowed; }
  .group.locked .chip::before { background:var(--lock-band); }
  .group.flagged { border-color:var(--warn); box-shadow:0 0 0 2px var(--warn); }
  .flag { display:flex; gap:6px; align-items:center; color:var(--warn); background:var(--warn-soft); padding:6px 14px; margin:0; font-size:14px; border-top:1px solid var(--warn-line); }
  .emptystate { flex:1; display:grid; place-items:center; color:var(--mute); font-size:22px; border:2px dashed var(--line); border-radius:14px; text-align:center; padding:40px; }

  /* drawers */
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:10; }
  .drawer { position:fixed; top:0; right:0; bottom:0; width:min(440px,100%); background:var(--panel); z-index:11; padding:16px; overflow:auto; box-shadow:-8px 0 30px rgba(0,0,0,.25); }
  .drawer > header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .roll { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0; }
  .roll button { border-radius:10px; padding:10px 14px; font-size:16px; }
  .roll button[aria-pressed=true] { background:var(--ok-soft); border-color:var(--ok); }
  .roll button[aria-pressed=false] { color:var(--mute); text-decoration:line-through; background:var(--off); }
  .seg { display:flex; margin-bottom:12px; }
  .seg button { flex:1; border-radius:0; padding:8px; }
  .seg button:first-child { border-radius:8px 0 0 8px; }
  .seg button:last-child { border-radius:0 8px 8px 0; border-left:0; }
  .seg button[aria-pressed=true] { background:var(--ink); color:var(--panel); border-color:var(--ink); }
  .editlist { list-style:none; padding:0; margin:10px 0; }
  .editlist li { display:flex; justify-content:space-between; align-items:center; padding:6px 4px; border-bottom:1px solid var(--line); }
  .menu { display:flex; flex-direction:column; gap:8px; }
  .menu button { text-align:left; padding:10px 12px; border-radius:10px; font-weight:600; }
  .menu button small { display:block; font-weight:400; }
  .menu .danger { color:var(--bad); border-color:var(--bad-line); }
  .form { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .pairform { display:grid; grid-template-columns:1fr auto 1fr; gap:6px; align-items:center; background:var(--bg); border-radius:10px; padding:10px; margin:6px 0 16px; }
  .pairform .btns { grid-column:1 / -1; display:flex; gap:6px; }
  .pairform .btns button { flex:1; padding:8px; font-weight:600; }
  .btn-good { border-color:var(--ok); color:var(--ok); }
  .btn-apart { border-color:var(--bad); color:var(--bad); }
  .rules h4 { margin:14px 0 4px; }
  .rules ul { list-style:none; padding:0; margin:0; }
  .rules li { display:flex; justify-content:space-between; gap:6px; padding:6px 8px; border-radius:6px; }
  .rules li:hover { background:var(--bg); }
  .empty { color:var(--mute); }
  .x { border:0; background:none; color:var(--mute); padding:0 4px; }
  .x:hover { color:var(--bad); }
  .flash { animation:flash 1.6s ease-out; }
  @keyframes flash { 0%,40% { background:var(--flash); } 100% { background:transparent; } }

  /* prototype chrome */
  #statepanel { position:fixed; bottom:12px; left:12px; z-index:50; background:#111; color:#cfe; border-radius:8px; font:12px/1.35 ui-monospace,monospace; max-width:360px; }
  #statepanel summary { cursor:pointer; padding:6px 10px; color:#fff; }
  #statepanel pre { margin:0; padding:0 10px 10px; max-height:50vh; overflow:auto; white-space:pre-wrap; }
  #toast { position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:60; background:#111; color:#fff; padding:10px 16px; border-radius:8px; display:none; max-width:90vw; }
  #toast.show { display:block; }
</style>

<body>
<div id="app"></div>
<details id="statepanel"><summary>Prototype state</summary><pre id="statepre"></pre></details>
<div id="toast" role="status"></div>
<script>
// ---------------------------------------------------------------- fake data
const NAMES_P2 = ['Ana','Ben','Cal','Dee','Eli','Fay','Gus','Hana','Ivo','Jade','Kai','Lena','Milo','Nia','Omar','Pia','Quinn','Ravi','Sami','Tess','Uma','Vic','Wren','Xavi','Yara'];
const NAMES_P5 = ['Abby','Bo','Chen','Dara','Ezra','Finn','Gia','Hugo','Iris','Jon','Kira','Leo','Maya','Ned','Ola','Pax','Rhea','Sol'];
let seq = 0; const nid = p => p + (++seq);
let ruleClock = 0;
function mkRoster(name, names) { return { id: nid('r'), name, students: names.map(n => ({ id: nid('s'), name: n, present: true })), rules: [] }; }
const sidOf = (R, n) => R.students.find(s => s.name === n).id;
const pair = (R, kind, a, b) => R.rules.push({ id: nid('u'), kind, a: sidOf(R, a), b: sidOf(R, b), created: ++ruleClock });
const P2 = mkRoster('Period 2', NAMES_P2), P5 = mkRoster('Period 5', NAMES_P5);
['Hana', 'Tess'].forEach(n => P2.students.find(s => s.name === n).present = false);
pair(P2, 'apart', 'Ben', 'Cal'); pair(P2, 'apart', 'Gus', 'Ivo');
pair(P2, 'good', 'Ana', 'Dee'); pair(P2, 'good', 'Dee', 'Eli'); pair(P2, 'good', 'Jade', 'Kai');
pair(P5, 'apart', 'Bo', 'Chen');

const S = {
  rosters: [P2, P5], rosterId: P2.id, target: 4, splitOverride: null, editingSplit: false, splitError: null,
  groups: null, stale: false, conflict: null, selected: null, lastMove: null, ruleError: null, focusRule: null,
  drawer: null, drafts: { pairA: '', pairB: '', newStudent: '', splitText: '' },
};

// ---------------------------------------------------------------- theme (system + manual toggle)
const THEMES = ['auto', 'light', 'dark'];
let theme = 'auto';
try { theme = localStorage.getItem('grouper-proto-theme') || 'auto'; } catch (e) {}
function applyTheme() {
  if (theme === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', theme);
  try { localStorage.setItem('grouper-proto-theme', theme); } catch (e) {}
}
applyTheme();

// ---------------------------------------------------------------- helpers
const R = () => S.rosters.find(r => r.id === S.rosterId);
const stu = id => R().students.find(s => s.id === id);
const nm = id => stu(id)?.name ?? '(deleted)';
const presentIds = () => R().students.filter(s => s.present).map(s => s.id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sum = a => a.reduce((x, y) => x + y, 0);
const shuffleArr = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function listNames(ids) { const n = ids.map(nm); return n.length <= 1 ? n.join('') : n.slice(0, -1).join(', ') + ' and ' + n.at(-1); }
const KIND = { good: 'good pair', apart: 'keep apart' };
function ruleText(r) { return `${nm(r.a)} & ${nm(r.b)}: ${KIND[r.kind]}`; }
const ruleById = id => R().rules.find(r => r.id === id);
const newestFirst = ids => [...new Set(ids)].sort((a, b) => (ruleById(b)?.created ?? 0) - (ruleById(a)?.created ?? 0));

// Good pairs that share a Student chain together (Ana+Dee, Dee+Eli => Ana, Dee, Eli together)
function togetherBlocks(rules) {
  let blocks = [];
  for (const r of rules.filter(r => r.kind === 'good')) {
    const hit = blocks.filter(b => b.members.has(r.a) || b.members.has(r.b));
    const merged = { members: new Set([r.a, r.b]), pairs: [r] };
    for (const b of hit) { b.members.forEach(m => merged.members.add(m)); merged.pairs.push(...b.pairs); }
    blocks = blocks.filter(b => !hit.includes(b)).concat([merged]);
  }
  return blocks;
}
function deriveSplit(n, t) {
  if (n === 0) return [];
  const k = Math.floor(n / t);
  if (k === 0) return [n];
  const sizes = Array(k).fill(t);
  let rem = n - k * t, i = k - 1;
  while (rem > 0) { sizes[i]++; rem--; i = (i - 1 + k) % k; }
  return sizes;
}
function splitText(sizes) {
  if (!sizes.length) return '—';
  const c = {}; sizes.forEach(s => c[s] = (c[s] || 0) + 1);
  return Object.keys(c).map(Number).sort((a, b) => a - b).map(s => `${c[s]}×${s}`).join(' + ');
}
function currentSplit() {
  const n = presentIds().length;
  if (S.splitOverride && sum(S.splitOverride) === n) return S.splitOverride;
  return deriveSplit(n, S.target);
}
function sizeWarnings() {
  const present = new Set(presentIds());
  return togetherBlocks(R().rules).map(b => [...b.members].filter(id => present.has(id)))
    .filter(pm => pm.length > S.target)
    .map(pm => `${listNames(pm)} are linked by Good pairs, so ${pm.length} must be together, but groups have ${S.target} students.`);
}
function markEdited() { if (S.groups) S.stale = true; }

let toastTimer;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2800); }

// ---------------------------------------------------------------- pair entry (refuse contradictions)
function addPair(kind) {
  const { pairA: a, pairB: b } = S.drafts;
  if (!a || !b || a === b) { S.ruleError = 'Pick two different Students.'; return; }
  const existing = R().rules.find(r => (r.a === a && r.b === b) || (r.a === b && r.b === a));
  if (existing) { S.ruleError = existing.kind === kind ? 'That pair already exists.' : `${nm(a)} & ${nm(b)} are already a ${KIND[existing.kind]} pair. Delete it first.`; return; }
  const rule = { id: nid('u'), kind, a, b, created: ++ruleClock };
  const rules = [...R().rules, rule];
  for (const blk of togetherBlocks(rules)) for (const ap of rules.filter(r => r.kind === 'apart')) {
    if (blk.members.has(ap.a) && blk.members.has(ap.b)) {
      S.ruleError = kind === 'apart'
        ? `${nm(a)} and ${nm(b)} are linked by Good pairs (${blk.pairs.map(p => `${nm(p.a)} & ${nm(p.b)}`).join(', ')}), so they can't be kept apart.`
        : `This Good pair would put ${nm(ap.a)} and ${nm(ap.b)} together, but they're set to keep apart.`;
      return;
    }
  }
  R().rules.push(rule); S.ruleError = null; S.drafts.pairA = S.drafts.pairB = ''; markEdited();
}

// ---------------------------------------------------------------- toy solver
function doShuffle() {
  const t = S.target, R0 = R(), present = new Set(presentIds());
  let locked = (S.groups || []).filter(g => g.locked).map(g => ({ ...g, members: g.members.filter(id => present.has(id)) }));
  const released = [];
  locked = locked.filter(g => { if (g.members.length < 2) { released.push(...g.members); return false; } return true; });
  const lockedOf = {}; locked.forEach(g => g.members.forEach(id => lockedOf[id] = g));
  const pool = [...present].filter(id => !lockedOf[id]);
  const blocks = togetherBlocks(R0.rules);
  const fail = (sentence, rules) => { S.conflict = { sentence, rules: newestFirst(rules) }; S.selected = null; };

  for (const b of blocks) {
    const pm = [...b.members].filter(id => present.has(id));
    if (pm.length > t) return fail(`${listNames(pm)} are linked by Good pairs, so ${pm.length} must be together, but groups have ${t} students.`, b.pairs.map(p => p.id));
    const lockedGroups = new Set(pm.filter(id => lockedOf[id]).map(id => lockedOf[id].id));
    const free = pm.filter(id => !lockedOf[id]);
    if (lockedGroups.size > 1 || (lockedGroups.size === 1 && free.length)) {
      const gi = S.groups.findIndex(g => lockedGroups.has(g.id)) + 1;
      return fail(`${listNames(pm)} must be together (Good pairs), but Locked Group ${gi} splits them. Unlock it or delete a Good pair.`, b.pairs.map(p => p.id));
    }
  }
  if (pool.length === 1) return fail(`${nm(pool[0])} would be in a group of 1, and Locked Groups can't grow. Unlock a Group to make room.`, []);
  if (present.size < 2) return fail('Fewer than two Students are Present.', []);

  const sizes = (!locked.length && S.splitOverride && sum(S.splitOverride) === present.size) ? [...S.splitOverride] : deriveSplit(pool.length, t);
  const poolSet = new Set(pool), used = new Set(), units = [];
  for (const b of blocks) { const m = [...b.members].filter(id => poolSet.has(id)); if (m.length > 1) { units.push(m); m.forEach(id => used.add(id)); } }
  pool.forEach(id => { if (!used.has(id)) units.push([id]); });
  const aparts = R0.rules.filter(r => r.kind === 'apart');
  const clash = (grp, u) => aparts.some(r => (grp.includes(r.a) && u.includes(r.b)) || (grp.includes(r.b) && u.includes(r.a)));
  let result = null;
  for (let attempt = 0; attempt < 3000 && !result; attempt++) {
    const groups = sizes.map(() => []);
    let ok = true;
    for (const u of shuffleArr(units).sort((x, y) => y.length - x.length)) {
      const cands = shuffleArr(groups.map((_, i) => i)).filter(i => groups[i].length + u.length <= sizes[i] && !clash(groups[i], u));
      if (!cands.length) { ok = false; break; }
      groups[cands[0]].push(...u);
    }
    if (ok) result = groups;
  }
  if (!result) return fail(`No way to make groups of ${splitText(sizes)} keeps every pair. (Prototype: the real app names the smallest set of clashing pairs.)`,
    R0.rules.filter(r => poolSet.has(r.a) && poolSet.has(r.b)).map(r => r.id));

  const fresh = result.map(m => ({ id: nid('g'), members: shuffleArr(m), locked: false }));
  const keep = Object.fromEntries(locked.map(g => [g.id, g]));
  const out = [];
  for (const g of S.groups || []) { if (keep[g.id]) out.push(keep[g.id]); else if (fresh.length) out.push(fresh.shift()); }
  out.push(...fresh);
  S.groups = out; S.stale = false; S.conflict = null; S.selected = null; S.lastMove = null;
  if (released.length) toast(`Lock released: ${listNames(released)} would have been alone in a Locked Group.`);
}

function violations() {
  const out = {}; if (!S.groups) return out;
  const groupOf = {}; S.groups.forEach(g => g.members.forEach(id => groupOf[id] = g));
  const push = (g, m) => (out[g.id] ||= []).push(m);
  for (const r of R().rules) {
    const ga = groupOf[r.a], gb = groupOf[r.b];
    if (!ga || !gb) continue;
    if (r.kind === 'apart' && ga === gb) push(ga, `${nm(r.a)} & ${nm(r.b)} should be kept apart`);
    if (r.kind === 'good' && ga !== gb) { const m = `${nm(r.a)} & ${nm(r.b)} are a good pair but in different Groups`; push(ga, m); push(gb, m); }
  }
  return out;
}

// ---------------------------------------------------------------- Manual move (swap)
function groupOfId(id) { return S.groups?.find(g => g.members.includes(id)); }
function swap(a, b) {
  if (!S.groups || a === b) return;
  const ga = groupOfId(a), gb = groupOfId(b);
  if (!ga || !gb) return;
  if (ga === gb) { S.selected = b; return; }
  const lk = [ga, gb].find(g => g.locked);
  if (lk) { toast(`Group ${S.groups.indexOf(lk) + 1} is Locked. Unlock it to move Students.`); S.selected = null; return; }
  ga.members[ga.members.indexOf(a)] = b; gb.members[gb.members.indexOf(b)] = a;
  S.selected = null; S.lastMove = `${nm(a)} ⇄ ${nm(b)}`;
}
function tapChip(id) {
  if (S.selected === id) { S.selected = null; return; }
  if (!S.selected) {
    const g = groupOfId(id);
    if (g?.locked) { toast(`Group ${S.groups.indexOf(g) + 1} is Locked. Unlock it to move Students.`); return; }
    S.selected = id; return;
  }
  swap(S.selected, id);
}

// ---------------------------------------------------------------- render
function rosterPicker() {
  return `<select data-change="roster" aria-label="Roster">${S.rosters.map(r => `<option value="${r.id}" ${r.id === S.rosterId ? 'selected' : ''}>${esc(r.name)}</option>`).join('')}</select>
    <button data-action="drawer" data-d="roster" aria-label="Roster options">⋯</button>`;
}
function rosterDrawer() {
  return `<p><small>Rosters are saved in this browser only. Export one to back it up or hand it to a colleague.</small></p>
    <div class="menu">
      <button data-action="export">⬇ Export “${esc(R().name)}”<small>Saves a .grouper.json file with the Students and pairs</small></button>
      <button data-action="import">⬆ Import a Roster file<small>Adds it as a new Roster; nothing is overwritten</small></button>
      <button data-action="new-roster">＋ New Roster</button>
      <button data-action="rename-roster">✎ Rename “${esc(R().name)}”</button>
      <button class="danger" data-action="delete-roster">🗑 Delete “${esc(R().name)}”…</button>
    </div>
    <input type="file" id="importFile" accept=".json,application/json" hidden data-change="import">`;
}
function exportRoster() {
  const R0 = R();
  const data = { grouper: 'roster', version: 1, name: R0.name, exported: new Date().toISOString().slice(0, 10),
    students: R0.students.map(s => s.name),
    pairs: R0.rules.map(r => ({ type: r.kind === 'good' ? 'good pair' : 'keep apart', students: [nm(r.a), nm(r.b)] })) };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
  a.download = `${R0.name}.grouper.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(`Exported “${R0.name}”.`);
}
function importRoster(text) {
  let d; try { d = JSON.parse(text); } catch (e) { return toast("That file isn't a grouper Roster."); }
  if (d?.grouper !== 'roster' || !Array.isArray(d.students)) return toast("That file isn't a grouper Roster.");
  let name = String(d.name || 'Imported Roster');
  if (S.rosters.some(r => r.name === name)) name += ' (imported)';
  const r = mkRoster(name, d.students.map(String));
  for (const p of d.pairs || []) {
    const [a, b] = (p.students || []).map(n => r.students.find(s => s.name === n)?.id);
    if (a && b) r.rules.push({ id: nid('u'), kind: p.type === 'good pair' ? 'good' : 'apart', a, b, created: ++ruleClock });
  }
  S.rosters.push(r); switchRoster(r.id); S.drawer = null;
  toast(`Imported “${name}”: ${r.students.length} Students, ${r.rules.length} pairs.`);
}
function switchRoster(id) {
  S.rosterId = id;
  Object.assign(S, { groups: null, stale: false, conflict: null, selected: null, splitOverride: null, ruleError: null, undo: null });
}
function sizeControls() {
  const n = presentIds().length, sp = currentSplit(), warns = sizeWarnings();
  const nLocked = S.groups?.filter(g => g.locked).length || 0;
  return `<div class="sizes">
    <label>Number of students in group</label>
    <span class="stepper"><button data-action="target-dec" aria-label="Fewer">−</button><output>${S.target}</output><button data-action="target-inc" aria-label="More">+</button></span>
    <span class="split">${S.editingSplit
      ? `<input data-draft="splitText" value="${esc(S.drafts.splitText)}" aria-label="Group sizes, comma separated"> <button data-action="split-save">Save</button> <button data-action="split-cancel">Cancel</button>`
      : `<b>${splitText(sp)}</b> <small>(${n} Present${S.splitOverride ? ', edited' : ''})</small> <button class="link" data-action="split-edit">Edit</button>${S.splitOverride ? `<button class="link" data-action="split-reset">Automatic</button>` : ''}`}</span>
    ${S.splitError || warns.length ? `<div class="msgs">${S.splitError ? `<p class="err">${esc(S.splitError)}</p>` : ''}${warns.map(w => `<p class="warn">⚠ ${esc(w)}</p>`).join('')}</div>` : ''}
  </div>`;
}
function notices() {
  let h = '';
  if (S.conflict) {
    const rules = S.conflict.rules.map(ruleById).filter(Boolean);
    h += `<div class="notice conflict" role="alert"><strong>Can't make Groups.</strong> ${esc(S.conflict.sentence)}
      ${rules.length ? `<details><summary>Show the pairs involved</summary><ul>${rules.map(r => `<li><a href="#" data-action="focus-rule" data-rid="${r.id}">${esc(ruleText(r))}</a></li>`).join('')}</ul></details>` : ''}</div>`;
  }
  if (S.stale) h += `<div class="notice stale">⚠ The Roster changed since these Groups were made, so they're out of date. <button data-action="shuffle">Reshuffle</button></div>`;
  if (S.selected) h += `<div class="notice hint"><span><b>${esc(nm(S.selected))}</b> selected. Tap a Student in another Group to swap.</span> <button data-action="deselect">Cancel</button></div>`;
  return h;
}
function chip(id) {
  const s = stu(id);
  return `<button class="chip ${S.selected === id ? 'sel' : ''} ${!s || !s.present ? 'gone' : ''}" draggable="true" data-action="chip" data-sid="${id}">${esc(nm(id))}</button>`;
}
const HUES = [212, 152, 28, 280, 350, 190, 48, 110, 250, 320];
const ICON_LOCK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>`;
const ICON_UNLOCK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></svg>`;
const ICON_WARN = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17.5v.5"/></svg>`;
function groupCard(g, i, flags, aspect = 1) {
  const f = [...new Set(flags[g.id] || [])];
  return `<section class="group ${g.locked ? 'locked' : ''} ${f.length ? 'flagged' : ''}" data-gid="${g.id}" style="--hue:${HUES[i % HUES.length]}" aria-label="Group ${i + 1}">
    <header><h3>Group ${i + 1}</h3><span class="gcount">${g.members.length} students</span>
      <button class="lockbtn" data-action="lock" data-gid="${g.id}" aria-pressed="${g.locked}" aria-label="${g.locked ? 'Unlock' : 'Lock'} Group ${i + 1}" title="${g.locked ? 'Locked: Reshuffle keeps this Group' : 'Lock: Reshuffle keeps this Group'}">${g.locked ? ICON_LOCK + 'Locked' : ICON_UNLOCK + 'Lock'}</button></header>
    <ul class="members ${g.members.length > 6 && aspect > 0.95 ? "two" : ""}">${g.members.map(id => `<li>${chip(id)}</li>`).join('')}</ul>
    ${f.map(m => `<p class="flag">${ICON_WARN}<span>${esc(m)}</span></p>`).join('')}</section>`;
}
function rollCall() {
  const R0 = R(), n = presentIds().length;
  const undo = S.undo ? `<div class="notice hint">Removed ${esc(S.undo.student.name)}${S.undo.rules.length ? ` and ${S.undo.rules.length} pair${S.undo.rules.length > 1 ? 's' : ''}` : ''}. <button data-action="undo-remove">Undo</button></div>` : '';
  const add = `<div class="form"><input data-draft="newStudent" value="${esc(S.drafts.newStudent)}" placeholder="Add a Student" data-enter="add-student"><button data-action="add-student">Add</button></div>`;
  const mode = `<div class="seg"><button data-action="roll-edit" data-v="" aria-pressed="${!S.rollEdit}">Attendance</button><button data-action="roll-edit" data-v="1" aria-pressed="${!!S.rollEdit}">Edit list</button></div>`;
  if (S.rollEdit) return `${mode}${undo}${add}<ul class="editlist">${R0.students.map(s => `<li><span>${esc(s.name)}</span><button class="x" data-action="remove-student" data-sid="${s.id}" aria-label="Remove ${esc(s.name)} from the Roster">✕ Remove</button></li>`).join('')}</ul>`;
  return `${mode}<p><small>Tap a name to mark them Absent or Present. ${n} of ${R0.students.length} Present.</small></p>
    <div class="roll">${R0.students.map(s => `<button aria-pressed="${s.present}" data-action="toggle-present" data-sid="${s.id}">${esc(s.name)}</button>`).join('')}</div>`;
}
function pairsEditor() {
  const R0 = R();
  const opts = sel => `<option value="">Student…</option>` + R0.students.map(s => `<option value="${s.id}" ${sel === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('');
  const li = r => `<li data-rule="${r.id}"><span>${esc(nm(r.a))} &amp; ${esc(nm(r.b))}</span><button class="x" data-action="del-rule" data-rid="${r.id}" title="Delete">✕</button></li>`;
  const list = kind => R0.rules.filter(r => r.kind === kind).map(li).join('') || '<li class="empty">None yet</li>';
  return `<div class="rules">
    <div class="pairform"><select data-draft="pairA">${opts(S.drafts.pairA)}</select><span>&amp;</span><select data-draft="pairB">${opts(S.drafts.pairB)}</select>
      <div class="btns"><button class="btn-good" data-action="add-pair" data-kind="good">＋ Good pair</button><button class="btn-apart" data-action="add-pair" data-kind="apart">＋ Keep apart</button></div></div>
    ${S.ruleError ? `<p class="err refuse">⛔ ${esc(S.ruleError)}</p>` : ''}
    <h4>Good pairs <small>always in the same Group</small></h4><ul>${list('good')}</ul>
    <h4>Keep apart <small>never in the same Group</small></h4><ul>${list('apart')}</ul>
  </div>`;
}

function render() {
  const flags = violations(), d = S.drawer, g = S.groups;
  // choose the column count whose cards come closest to a comfortable portrait-ish shape, with few empty slots
  let cols = 1, rows = 1, aspect = 1;
  if (g) {
    const W = innerWidth - 32, H = innerHeight - 90 - (S.conflict || S.stale || S.selected ? 56 : 0);
    let best = Infinity;
    for (let c = 1; c <= g.length; c++) {
      const r = Math.ceil(g.length / c), w = (W - (c - 1) * 14) / c, h = (H - (r - 1) * 14) / r;
      const score = Math.abs(Math.log((w / h) / 1.2)) + 0.35 * (r * c - g.length);
      if (score < best) { best = score; cols = c; rows = r; aspect = w / h; }
    }
  }
  document.getElementById('app').innerHTML = `
    <div class="bar"><div class="brand">grouper</div>${rosterPicker()}
      <button data-action="drawer" data-d="students">✓ ${presentIds().length}/${R().students.length} Present</button>
      <button data-action="drawer" data-d="rules">Pairs (${R().rules.length})</button>
      ${sizeControls()}<span class="spacer"></span>
      <button class="theme" data-action="theme" title="Theme">${{ auto: '◐ Auto', light: '☀ Light', dark: '☾ Dark' }[theme]}</button>
      <button class="shuffle" data-action="shuffle">${g ? 'Reshuffle' : 'Shuffle'}${g?.some(x => x.locked) ? ` <small>keeps ${g.filter(x => x.locked).length} Locked</small>` : ''}</button></div>
    <div class="board">${notices()}
      ${g ? `<div class="tiles" style="--cols:${cols};--rows:${rows}">${g.map((x, i) => groupCard(x, i, flags, aspect)).join("")}</div>` : (S.conflict ? '' : `<div class="emptystate">Take the roll (✓ Present), then Shuffle.</div>`)}</div>
    ${d ? `<div class="overlay" data-action="drawer" data-d=""></div><aside class="drawer"><header><h3>${{ students: 'Students', rules: 'Pairs', roster: esc(R().name) }[d]}</h3><button data-action="drawer" data-d="">Done</button></header>${{ students: rollCall, rules: pairsEditor, roster: rosterDrawer }[d]()}</aside>` : ''}`;
  document.getElementById('statepre').textContent = JSON.stringify({
    roster: R().name, present: `${presentIds().length}/${R().students.length}`, studentsPerGroup: S.target,
    split: splitText(currentSplit()), splitEdited: !!S.splitOverride, stale: S.stale, selected: S.selected && nm(S.selected), lastMove: S.lastMove,
    conflict: S.conflict?.sentence ?? null, theme,
    groups: g ? g.map((x, i) => `${i + 1}${x.locked ? '🔒' : ''}: ${x.members.map(nm).join(', ')}`) : null,
    flags, pairs: R().rules.map(ruleText),
  }, null, 1);
  if (S.focusRule) {
    const el = document.querySelector(`[data-rule="${S.focusRule}"]`);
    if (el) { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); el.classList.add('flash'); }
    S.focusRule = null;
  }
}

// ---------------------------------------------------------------- events
function act(a, el) {
  const sid = el.dataset.sid;
  switch (a) {
    case 'chip': tapChip(sid); break;
    case 'deselect': S.selected = null; break;
    case 'lock': { const g = S.groups.find(x => x.id === el.dataset.gid); g.locked = !g.locked; if (g.locked && S.selected && g.members.includes(S.selected)) S.selected = null; break; }
    case 'shuffle': doShuffle(); break;
    case 'theme': theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length]; applyTheme(); break;
    case 'target-dec': if (S.target > 2) { S.target--; S.splitOverride = null; markEdited(); } break;
    case 'target-inc': if (S.target < presentIds().length) { S.target++; S.splitOverride = null; markEdited(); } break;
    case 'split-edit': S.editingSplit = true; S.splitError = null; S.drafts.splitText = currentSplit().join(', '); break;
    case 'split-cancel': S.editingSplit = false; S.splitError = null; break;
    case 'split-reset': S.splitOverride = null; markEdited(); break;
    case 'split-save': {
      const sizes = S.drafts.splitText.split(/[,\s+]+/).filter(Boolean).map(Number);
      const n = presentIds().length;
      if (sizes.some(x => !Number.isInteger(x) || x < 1)) S.splitError = 'Use whole numbers, e.g. 4, 4, 5.';
      else if (sizes.some(x => x === 1)) S.splitError = "A group of 1 isn't allowed.";
      else if (sum(sizes) !== n) S.splitError = `Those sizes add up to ${sum(sizes)}, but ${n} Students are Present.`;
      else { S.splitOverride = sizes; S.editingSplit = false; S.splitError = null; markEdited(); }
      break;
    }
    case 'toggle-present': { const s = stu(sid); s.present = !s.present; markEdited(); break; }
    case 'add-student': {
      const name = S.drafts.newStudent.trim(); if (!name) return;
      R().students.push({ id: nid('s'), name, present: true }); S.drafts.newStudent = ''; markEdited(); break;
    }
    case 'roll-edit': S.rollEdit = !!el.dataset.v; S.undo = null; break;
    case 'remove-student': {
      const R0 = R(), idx = R0.students.findIndex(s => s.id === sid);
      const rules = R0.rules.filter(r => r.a === sid || r.b === sid);
      S.undo = { student: R0.students[idx], idx, rules };
      R0.students.splice(idx, 1); R0.rules = R0.rules.filter(r => !rules.includes(r)); markEdited(); break;
    }
    case 'undo-remove': { const R0 = R(), u = S.undo; R0.students.splice(u.idx, 0, u.student); R0.rules.push(...u.rules); S.undo = null; markEdited(); break; }
    case 'export': exportRoster(); return;
    case 'import': document.getElementById('importFile').click(); return;
    case 'new-roster': { const name = prompt('Name for the new Roster?'); if (!name) return; const r = mkRoster(name, []); S.rosters.push(r); switchRoster(r.id); S.drawer = 'students'; S.rollEdit = true; break; }
    case 'rename-roster': { const name = prompt('New name?', R().name); if (name) R().name = name; break; }
    case 'delete-roster': {
      if (S.rosters.length === 1) { toast("You can't delete your only Roster."); return; }
      if (!confirm(`Delete “${R().name}” and all its Students and pairs? Export it first if you might want it back.`)) return;
      S.rosters = S.rosters.filter(r => r.id !== S.rosterId); switchRoster(S.rosters[0].id); S.drawer = null; break;
    }
    case 'add-pair': addPair(el.dataset.kind); break;
    case 'del-rule': R().rules = R().rules.filter(r => r.id !== el.dataset.rid); S.ruleError = null; markEdited(); break;
    case 'focus-rule': S.focusRule = el.dataset.rid; S.drawer = 'rules'; break;
    case 'drawer': S.drawer = el.dataset.d || null; break;
  }
  render();
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  if (el.tagName === 'A') e.preventDefault();
  act(el.dataset.action, el);
});
document.addEventListener('input', e => { const k = e.target.dataset.draft; if (k) S.drafts[k] = e.target.value; });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.draft) { S.drafts[t.dataset.draft] = t.value; return; }
  if (t.dataset.change === 'roster') { switchRoster(t.value); render(); }
  if (t.dataset.change === 'import' && t.files[0]) { t.files[0].text().then(txt => { importRoster(txt); render(); }); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset?.enter) { act(e.target.dataset.enter, e.target); return; }
  if (e.key === 'Escape') { if (S.drawer) S.drawer = null; else if (S.selected) S.selected = null; else return; render(); }
});
// drag-to-swap (mouse; touch uses tap-to-swap)
document.addEventListener('dragstart', e => {
  const c = e.target.closest?.('.chip'); if (!c) return;
  e.dataTransfer.setData('text/plain', c.dataset.sid); e.dataTransfer.effectAllowed = 'move';
});
document.addEventListener('dragover', e => {
  const c = e.target.closest?.('.chip, .group'); if (!c) return;
  e.preventDefault();
  document.querySelectorAll('.chip.over').forEach(x => x.classList.remove('over'));
  if (c.classList.contains('chip')) c.classList.add('over');
});
document.addEventListener('drop', e => {
  e.preventDefault();
  document.querySelectorAll('.chip.over').forEach(x => x.classList.remove('over'));
  const from = e.dataTransfer.getData('text/plain'), c = e.target.closest?.('.chip');
  if (!from) return;
  if (c) { swap(from, c.dataset.sid); render(); } else toast('Drop onto a Student to swap with them.');
});

// ?demo shows every card state at once (Locked, flagged, selected); ?theme=dark|light forces a theme
const Q = new URLSearchParams(location.search);
if (Q.get('theme')) { theme = Q.get('theme'); applyTheme(); }
if (Q.has('size')) S.target = +Q.get('size');
if (Q.has('demo')) {
  doShuffle();
  if (S.groups) {
  S.groups[1].locked = true;
  const ben = sidOf(P2, 'Ben'), cal = sidOf(P2, 'Cal');
  const gc = groupOfId(cal);
  if (!gc.locked && !groupOfId(ben).locked) swap(ben, gc.members.find(x => x !== cal));
  S.selected = S.groups.find(g => !g.locked && !violations()[g.id])?.members[0] ?? null;
  }
  if (Q.has('drawer')) S.drawer = Q.get('drawer');
}
addEventListener("resize", () => render());
render();
</script>
</body>
