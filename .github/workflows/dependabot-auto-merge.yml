name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write
  actions: write # gh workflow run

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Every Dependabot PR, majors included, merges once the required check passes.
  # A merge made with GITHUB_TOKEN doesn't trigger deploy.yml's push run, but
  # workflow_dispatch is exempt, so this job waits for the merge and dispatches it.
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          echo "Updating $DEPENDENCIES ($UPDATE_TYPE)"
          gh pr merge --auto --squash "$PR_URL"
        env:
          DEPENDENCIES: ${{ steps.metadata.outputs.dependency-names }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy once merged
        run: |
          while :; do
            case "$(gh pr view "$PR_URL" --json state --jq .state)" in
              MERGED) exec gh workflow run deploy.yml --ref main ;;
              CLOSED) echo "PR closed without merging"; exit 0 ;;
            esac
            sleep 30
          done
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
