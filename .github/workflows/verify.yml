name: Verify

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # The ruleset on main requires this job by name, so rename it there too if it changes.
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # spec: stack-and-hosting.md (Crawlers): Lighthouse's SEO audit of the built site must score 100
      # (lighthouserc.json). The runner's preinstalled Chrome is used.
      - run: npm run lighthouse
