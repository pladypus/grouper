name: Verify

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # The ruleset on main requires this job by name, so rename it there too if it changes.
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Unit tests, then Lighthouse's SEO audit of a fresh build (spec: stack-and-hosting.md, Crawlers),
      # using the runner's preinstalled Chrome.
      - run: npm test
      - run: npm run build
